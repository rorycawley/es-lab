services:
  postgres:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./resources/docker/postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 2s
      timeout: 5s
      retries: 30

  flyway:
    image: flyway/flyway:13.0.0
    command:
      - -url=jdbc:postgresql://postgres:5432/event_store
      - -user=cart_migrator
      - -password=cart_migrator
      - -locations=filesystem:/flyway/migrations
      - -connectRetries=60
      - migrate
    volumes:
      - ./resources/db/migration:/flyway/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
